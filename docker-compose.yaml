services:
  mortgage-postgres:
    image: loandb:0.5
    environment:
      POSTGRES_USER: mortgage
      POSTGRES_PASSWORD: mortgage
      POSTGRES_DB: mortgage
    ports:
      - "5439:5432"
    healthcheck:
    test: [ "CMD-SHELL", "pg_isready -U mortgage -d mortgage" ]
    interval: 5s
    timeout: 5s
    retries: 20

  minio:
    image: pgsty/silo:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
