<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Пользователи</title>
    <style>
        :root {
            --border: #ddd;
            --bg: #f7f7f9;
            --accent: #2b6cb0;
            --error: #c53030;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 24px;
            background: var(--bg);
            color: #222;
        }

        h1 {
            margin: 0 0 16px;
            font-size: 22px;
        }

        form {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px;
            align-items: end;
        }

        form label {
            display: flex;
            flex-direction: column;
            font-size: 12px;
            color: #666;
            gap: 4px;
        }

        input,
        select,
        button {
            font: inherit;
            padding: 6px 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: #fff;
        }

        button {
            cursor: pointer;
        }

        button.primary {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        #status {
            min-height: 20px;
            font-size: 13px;
            color: #555;
            margin-bottom: 12px;
        }

        #status.error {
            color: var(--error);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
        }

        th,
        td {
            padding: 8px 10px;
            text-align: left;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
        }

        th {
            background: #eef2f7;
            font-weight: 600;
            user-select: none;
        }

        /* --- Индикаторы сортировки --- */
        th.sortable {
            cursor: pointer;
            position: relative;
            padding-right: 22px;
            /* место под значок */
        }

        th.sortable:hover {
            background: #e2e8f0;
        }

        /* Значок по умолчанию — «можно сортировать» */
        th.sortable::after {
            content: '⇅';
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 12px;
            color: #9aa5b1;
            transition: color .15s;
        }

        /* Активная сортировка: по возрастанию */
        th.sortable[data-dir="asc"]::after {
            content: '↑';
            color: var(--accent);
            font-weight: 700;
        }

        /* Активная сортировка: по убыванию */
        th.sortable[data-dir="desc"]::after {
            content: '↓';
            color: var(--accent);
            font-weight: 700;
        }

        /* Наведение на неактивную — чуть темнее значок */
        th.sortable:not([data-dir]):hover::after {
            color: #4a5568;
        }

        /* --- /Индикаторы сортировки --- */

        tbody tr {
            cursor: pointer;
        }

        tbody tr:hover {
            background: #f0f7ff;
        }

        td.empty {
            text-align: center;
            color: #888;
            padding: 24px;
        }

        #detail {
            margin-top: 16px;
            padding: 16px;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 8px;
        }

        #detail h2 {
            margin: 0 0 12px;
            font-size: 18px;
        }

        #detail dl {
            display: grid;
            grid-template-columns: 140px 1fr;
            gap: 6px 12px;
            margin: 0;
        }

        #detail dt {
            color: #666;
        }

        #detail dd {
            margin: 0;
        }
    </style>
</head>

<body>

    <h1>Пользователи</h1>

    <form id="filters">
        <label>Сортировка
            <select name="sort">
                <option value="">По ID (по умолчанию)</option>
                <option value="name">По имени</option>
            </select>
        </label>
        <label>Дата рождения с
            <input type="date" name="from">
        </label>
        <label>по
            <input type="date" name="to">
        </label>
        <label>Год рождения
            <input type="number" name="year" min="1900" max="2100" placeholder="например 1990">
        </label>
        <label>Email содержит
            <input type="text" name="emailContains" placeholder="gmail">
        </label>
        <button type="submit" class="primary">Применить</button>
        <button type="button" id="reset">Сбросить</button>
    </form>

    <div id="status"></div>

    <div id="detail" hidden></div>

    <table id="users-table">
        <thead>
            <tr>
                <th class="sortable" data-sort="id" title="Сортировать по «ID»">ID</th>
                <th class="sortable" data-sort="name" title="Сортировать по «Имя»">Имя</th>
                <th>Дата рождения</th>
                <th>Город</th>
                <th>Адрес</th>
                <th>Email</th>
                <th>Телефон</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>



    <script>
        const API = '/api/users';

        const form = document.getElementById('filters');
        const statusEl = document.getElementById('status');
        const tbody = document.querySelector('#users-table tbody');
        const detailEl = document.getElementById('detail');
        const sortableHeaders = document.querySelectorAll('th.sortable');

        const esc = s => s == null ? '' :
            String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

        function setStatus(msg, isError = false) {
            statusEl.textContent = msg;
            statusEl.className = isError ? 'error' : '';
        }

        function collectParams() {
            const fd = new FormData(form);
            const params = {};
            for (const [k, v] of fd.entries()) {
                if (v !== '') params[k] = v;
            }
            return params;
        }

        async function fetchUsers(params) {
            const qs = new URLSearchParams(params).toString();
            const url = qs ? `${API}?${qs}` : API;
            setStatus('Загрузка...');
            try {
                const res = await fetch(url);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const users = await res.json();
                renderTable(users);
                const note = params.year && (params.from || params.to)
                    ? ' (год приоритетнее, from/to проигнорированы сервером)'
                    : '';
                setStatus(`Найдено: ${users.length}${note}`);
            } catch (e) {
                setStatus('Ошибка: ' + e.message, true);
                tbody.innerHTML = '';
            }
        }

        function renderTable(users) {
            if (!users.length) {
                tbody.innerHTML = '<tr><td colspan="7" class="empty">Ничего не найдено</td></tr>';
                return;
            }
            tbody.innerHTML = users.map(u => `
    <tr data-id="${u.id}">
      <td>${u.id}</td>
      <td>${esc(u.name)}</td>
      <td>${u.birthDate ?? ''}</td>
      <td>${esc(u.city)}</td>
      <td>${esc(u.address)}</td>
      <td>${esc(u.email)}</td>
      <td>${esc(u.phone)}</td>
    </tr>
  `).join('');
        }

        async function loadUser(id) {
            detailEl.hidden = false;
            detailEl.textContent = 'Загрузка...';
            try {
                const res = await fetch(`${API}/${id}`);
                if (res.status === 404) { detailEl.textContent = `Пользователь #${id} не найден`; return; }
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const u = await res.json();
                detailEl.innerHTML = `
      <h2>Карточка #${u.id}</h2>
      <dl>
        <dt>Имя</dt><dd>${esc(u.name)}</dd>
        <dt>Дата рождения</dt><dd>${u.birthDate ?? ''}</dd>
        <dt>Город</dt><dd>${esc(u.city)}</dd>
        <dt>Адрес</dt><dd>${esc(u.address)}</dd>
        <dt>Email</dt><dd>${esc(u.email)}</dd>
        <dt>Телефон</dt><dd>${esc(u.phone)}</dd>
      </dl>
      <p><button id="close-detail">Закрыть</button></p>
    `;
                document.getElementById('close-detail').onclick = () => { detailEl.hidden = true; };
            } catch (e) {
                detailEl.textContent = 'Ошибка: ' + e.message;
            }
        }

        /* --- Индикаторы сортировки --- */

        function updateSortIndicators() {
            const current = form.elements.sort.value; // '' или 'name'
            sortableHeaders.forEach(th => {
                const key = th.dataset.sort;
                // Пустой sort на бэке = сортировка по id по возрастанию
                const isActive = (current === '' && key === 'id') || current === key;
                if (isActive) {
                    th.dataset.dir = 'asc'; // бэк умеет только asc
                } else {
                    delete th.dataset.dir;
                }
            });
        }

        sortableHeaders.forEach(th => {
            th.addEventListener('click', () => {
                const key = th.dataset.sort;
                const current = form.elements.sort.value;

                if (current === key) {
                    // Уже отсортировано по этой колонке (asc) — бэк не поддерживает desc,
                    // поэтому повторный клик ничего не меняет. Заглушка на будущее.
                    return;
                }

                // id — это «дефолтная» сортировка, в параметр не пишем
                form.elements.sort.value = (key === 'id' ? '' : key);
                fetchUsers(collectParams());
                updateSortIndicators();
            });
        });

        /* --- /Индикаторы сортировки --- */

        form.addEventListener('submit', e => {
            e.preventDefault();
            fetchUsers(collectParams());
        });

        document.getElementById('reset').onclick = () => {
            form.reset();
            detailEl.hidden = true;
            fetchUsers({}).then(updateSortIndicators);
        };

        tbody.addEventListener('click', e => {
            const tr = e.target.closest('tr[data-id]');
            if (tr) loadUser(tr.dataset.id);
        });

        /* Стартовая загрузка + расстановка индикаторов */
        fetchUsers({}).then(updateSortIndicators);
    </script>
</body>

</html>
